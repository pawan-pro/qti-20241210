# Netlify Configuration File

[build]
  command = "npm run build"
  publish = ".next"

[functions]
  node_bundler = "esbuild"

  [functions.node_bundler_exclude_files]
  external_node_modules = []
  included_files = [
    "node_modules/.cache/**",
    "node_modules/**/*.map",
    "node_modules/**/*.md"
  ]

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 3000
  framework = "next"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/_next/image"
  to = "/.netlify/images"
  status = 200
  query = { url = ":url", w = ":width", q = ":quality" }

[[redirects]]
  from = "/_ipx/*"
  to = "/.netlify/images"
  status = 200
  query = { url = ":url", w = ":width", q = ":quality" }

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
